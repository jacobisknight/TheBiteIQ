kind = "mobile"
previewPath = "/"
title = "BiteIQ"
version = "1.0.0"
id = "artifacts/biteiq"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23437

[services.development]
run = "pnpm --filter @workspace/biteiq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biteiq", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/biteiq", "run", "serve" ]

[services.env]
PORT = "23437"
BASE_PATH = "/"
